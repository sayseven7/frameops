services:
  postgres:
    image: postgres:18.4@sha256:3a82e1f56c8f0f5616a11103ac3d47e632c3938698946a7ad26da0df1334744a
    environment:
      POSTGRES_USER: ${FRAMEOPS_POSTGRES_USER:?set FRAMEOPS_POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${FRAMEOPS_POSTGRES_PASSWORD:?set FRAMEOPS_POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${FRAMEOPS_POSTGRES_DB:?set FRAMEOPS_POSTGRES_DB in .env}
    ports:
      - "127.0.0.1:${FRAMEOPS_POSTGRES_PORT:?set FRAMEOPS_POSTGRES_PORT in .env}:5432"
    volumes:
      - frameops-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:a1a8bd4ac40ad7881a245bab97323e18f971e4d4cba2c2007ec1bedd21cbaba2
    command: server /data
    environment:
      MINIO_ROOT_USER: ${FRAMEOPS_MINIO_ROOT_USER:?set FRAMEOPS_MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${FRAMEOPS_MINIO_ROOT_PASSWORD:?set FRAMEOPS_MINIO_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:${FRAMEOPS_MINIO_PORT:?set FRAMEOPS_MINIO_PORT in .env}:9000"
    volumes:
      - frameops-minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  frameops-postgres-data:
  frameops-minio-data:
