services:
  postgres:
    image: postgres:18.4@sha256:3a82e1f56c8f0f5616a11103ac3d47e632c3938698946a7ad26da0df1334744a
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 512M
    restart: unless-stopped
    stop_grace_period: 10s
    environment:
      POSTGRES_USER: ${FRAMEOPS_POSTGRES_USER:?set FRAMEOPS_POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${FRAMEOPS_POSTGRES_PASSWORD:?set FRAMEOPS_POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${FRAMEOPS_POSTGRES_DB:?set FRAMEOPS_POSTGRES_DB in .env}
    ports:
      - "127.0.0.1:${FRAMEOPS_POSTGRES_PORT:?set FRAMEOPS_POSTGRES_PORT in .env}:5432"
    volumes:
      - frameops-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 512M
    restart: unless-stopped
    stop_grace_period: 10s
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/minio-root-user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio-root-password
    ports:
      - "127.0.0.1:${FRAMEOPS_MINIO_PORT:?set FRAMEOPS_MINIO_PORT in .env}:9000"
    volumes:
      - frameops-minio-data:/data
      - type: bind
        source: ${FRAMEOPS_MINIO_ROOT_USER_FIFO:?set FRAMEOPS_MINIO_ROOT_USER_FIFO to a FIFO path}
        target: /run/secrets/minio-root-user
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${FRAMEOPS_MINIO_ROOT_PASSWORD_FIFO:?set FRAMEOPS_MINIO_ROOT_PASSWORD_FIFO to a FIFO path}
        target: /run/secrets/minio-root-password
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
      target: migrate
    restart: "no"
    environment:
      FRAMEOPS_DATABASE_URL: ${FRAMEOPS_DATABASE_URL:?set FRAMEOPS_DATABASE_URL in .env}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["up"]

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
      target: api
    restart: unless-stopped
    stop_grace_period: 10s
    environment:
      FRAMEOPS_DATABASE_URL: ${FRAMEOPS_DATABASE_URL:?set FRAMEOPS_DATABASE_URL in .env}
      FRAMEOPS_EVIDENCE_S3_ENDPOINT: http://minio:9000
      FRAMEOPS_EVIDENCE_S3_BUCKET: ${FRAMEOPS_EVIDENCE_S3_BUCKET:?set FRAMEOPS_EVIDENCE_S3_BUCKET in .env}
      FRAMEOPS_EVIDENCE_S3_REGION: ${FRAMEOPS_EVIDENCE_S3_REGION:?set FRAMEOPS_EVIDENCE_S3_REGION in .env}
      FRAMEOPS_EVIDENCE_S3_ACCESS_KEY: ${FRAMEOPS_EVIDENCE_S3_ACCESS_KEY:?set FRAMEOPS_EVIDENCE_S3_ACCESS_KEY in .env}
      FRAMEOPS_EVIDENCE_S3_SECRET_KEY: ${FRAMEOPS_EVIDENCE_S3_SECRET_KEY:?set FRAMEOPS_EVIDENCE_S3_SECRET_KEY in .env}
      FRAMEOPS_OBJECT_RETENTION_DAYS: ${FRAMEOPS_OBJECT_RETENTION_DAYS:?set FRAMEOPS_OBJECT_RETENTION_DAYS in .env}
      FRAMEOPS_HTTP_ADDR: 0.0.0.0:8080
      FRAMEOPS_PDF_WORKER: /frameops-render
    ports:
      - "127.0.0.1:${FRAMEOPS_API_PORT:?set FRAMEOPS_API_PORT in .env}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        FRAMEOPS_API_URL: http://api:8080
        FRAMEOPS_COMPOSE_INTERNAL_API: "1"
    environment:
      FRAMEOPS_API_URL: http://api:8080
      FRAMEOPS_COMPOSE_INTERNAL_API: "1"
    restart: unless-stopped
    stop_grace_period: 10s
    ports:
      - "127.0.0.1:${FRAMEOPS_UI_PORT:?set FRAMEOPS_UI_PORT in .env}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e 'require(\"http\").get(\"http://127.0.0.1:3000/login\", r => process.exit(r.statusCode >= 200 && r.statusCode < 300 ? 0 : 1)).on(\"error\", () => process.exit(1))'"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  frameops-postgres-data:
  frameops-minio-data:
